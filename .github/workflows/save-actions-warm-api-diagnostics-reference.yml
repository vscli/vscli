name: Source-action API readiness diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: save-source-api-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    name: Source API diagnostics (${{ matrix.os }})
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify exact ten-input diagnostic identity before dependency setup
        run: node -e "require('./tests/vscode-reference-save-actions-warm-api-diagnostics-candidate/save-configuration-ready.cjs').sourceIdentity(require('node:path').resolve('tests/vscode-reference-save-actions-warm-api-diagnostics-candidate'))"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/vscode-reference-save-actions-warm-api-diagnostics-candidate
      - name: Test diagnostic and unchanged setup contracts
        run: node --test tests/vscode-reference-save-actions-warm-api-diagnostics-candidate/save-source-api-diagnostics.test.cjs tests/vscode-reference-save-actions-warm-api-diagnostics-candidate/save-code-actions-readiness.test.cjs tests/vscode-reference-save-actions-warm-api-diagnostics-candidate/save-code-actions-diagnostics.test.cjs tests/vscode-reference-save-actions-warm-api-diagnostics-candidate/save-configuration-ready.test.cjs
      - name: Record trusted exact revision and create cache parent
        env:
          CANDIDATE_REVISION: ${{ github.sha }}
        run: node -e "const fs=require('node:fs');const revision=process.env.CANDIDATE_REVISION;if(!/^[0-9a-f]{40}$/.test(revision)||require('node:child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==revision)throw Error('Checked-out revision differs from trusted workflow revision');fs.mkdirSync('target/vscode-reference',{recursive:true});fs.mkdirSync('target/save-actions-warm-api-diagnostics',{recursive:true});fs.writeFileSync('target/save-actions-warm-api-diagnostics/candidate-revision.txt',revision+'\n')"
      - name: Capture diagnostic candidate once (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 6
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a node tests/vscode-reference-save-actions-warm-api-diagnostics-candidate/save-code-actions-run.cjs target/save-actions-warm-api-diagnostics/result 2>&1 | tee target/save-actions-warm-api-diagnostics/capture.log
      - name: Capture diagnostic candidate once (macOS and Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 6
        shell: bash
        run: |
          set -o pipefail
          node tests/vscode-reference-save-actions-warm-api-diagnostics-candidate/save-code-actions-run.cjs target/save-actions-warm-api-diagnostics/result 2>&1 | tee target/save-actions-warm-api-diagnostics/capture.log
      - name: Preserve all source and raw prefix on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: save-source-api-diagnostics-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/save-actions-warm-api-diagnostics
            tests/vscode-reference-save-actions-warm-api-diagnostics-candidate/*.cjs
            tests/vscode-reference-save-actions-warm-api-diagnostics-candidate/*.json
            tests/vscode-reference-save-actions-warm-api-diagnostics-candidate/*.md

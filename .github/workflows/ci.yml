name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  commits:
    name: Commit style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check one-line conventional commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/check_commits.py "$BASE_SHA..$HEAD_SHA"
          else
            python3 scripts/check_commits.py "$HEAD_SHA"
          fi
  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action
        with:
          toolchain: '1.99.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test extension-host/api-types.test.cjs extension-host/api.test.cjs extension-host/configuration.test.cjs extension-host/host.test.cjs extension-host/prompts.test.cjs extension-host/activation.test.cjs extension-host/activation-host.test.cjs extension-host/document-services.test.cjs extension-host/memento.test.cjs extension-host/surfaces.test.cjs
      - run: node --test extension-host/providers.test.cjs extension-host/provider-wire.test.cjs
      - run: node --test extension-host/diagnostics.test.cjs
      - run: node --test extension-host/code-actions.test.cjs
      - run: node --test extension-host/signatures.test.cjs
      - run: node --test extension-host/symbols.test.cjs
      - run: cargo test --locked
      - run: cargo build --locked
      - run: node --test tests/vscode-reference/compare.test.cjs tests/vscode-reference/supervisor.test.cjs tests/vscode-reference/diagnostics-compare.test.cjs tests/vscode-reference/outline-settlement.test.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/vscode-reference
      - run: node --test tests/vscode-reference/language-readiness.test.cjs
      - name: Run pinned VS Code reference (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/vscode-reference/run.cjs target/vscode-reference/result
      - name: Run pinned VS Code reference (macOS and Windows)
        if: runner.os != 'Linux'
        run: node tests/vscode-reference/run.cjs target/vscode-reference/result
      - name: Compare bindings and configuration contracts
        run: node tests/vscode-reference/compare.cjs target/vscode-reference/result target/debug/vscli${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Compare diagnostic collection contracts
        run: node tests/vscode-reference/diagnostics-compare.cjs target/vscode-reference/result
      - name: Compare native snippet sessions with the pinned editor
        run: cargo run --locked --example snippet_contract -- target/vscode-reference/result/snippets.json > target/vscode-reference/result/snippets-vscli.json
      - name: Compare snippet insertion context with the pinned editor
        run: cargo run --locked --example snippet_contract -- --insertion target/vscode-reference/result/snippet-insertion.json > target/vscode-reference/result/snippet-insertion-vscli.json
      - name: Compare snippet variables and cancellation with the pinned editor
        run: cargo run --locked --example snippet_contract -- --variables target/vscode-reference/result/snippet-variables.json > target/vscode-reference/result/snippet-variables-vscli.json
      - name: Compare native typing gestures with the pinned editor
        run: cargo run --locked --example typing_contract -- target/vscode-reference/result/typing.json > target/vscode-reference/result/typing-vscli.json
      - name: Observe prepared advanced indentation (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: xvfb-run -a node tests/vscode-reference/advanced-indentation-run.cjs target/vscode-reference/result/advanced
      - name: Observe prepared advanced indentation (macOS and Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 6
        run: node tests/vscode-reference/advanced-indentation-run.cjs target/vscode-reference/result/advanced
      - name: Compare advanced indentation with the pinned editor
        run: cargo run --locked --example advanced_indentation_contract -- target/vscode-reference/result/advanced/advanced-indentation.json > target/vscode-reference/result/advanced/advanced-indentation-vscli.json
      - name: Observe installed language configurations (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: xvfb-run -a node tests/vscode-reference/language-configuration-run.cjs target/vscode-reference/result/language-configuration
      - name: Observe installed language configurations (macOS and Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 6
        run: node tests/vscode-reference/language-configuration-run.cjs target/vscode-reference/result/language-configuration
      - name: Compare native installed language configurations with the pinned editor
        run: cargo run --locked --example language_configuration_contract -- target/vscode-reference/result/language-configuration/language-configuration.json --bundled > target/vscode-reference/result/language-configuration/language-configuration-vscli.json
      - name: Check configuration reference source validation
        run: cargo test --locked --example language_configuration_contract
      - name: Observe native navigation history (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: xvfb-run -a node tests/vscode-reference/navigation-history-run.cjs target/vscode-reference/result/navigation-history
      - name: Observe native navigation history (macOS and Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 6
        run: node tests/vscode-reference/navigation-history-run.cjs target/vscode-reference/result/navigation-history
      - name: Compare native navigation history with the pinned editor
        run: cargo run --locked --example navigation_history_contract -- target/vscode-reference/result/navigation-history/navigation-history.json > target/vscode-reference/result/navigation-history/navigation-history-vscli.json
      - name: Check navigation reference source validation
        run: cargo test --locked --example navigation_history_contract
      - name: Observe pinned Outline provider contracts (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a node tests/vscode-reference/outline-run.cjs target/vscode-reference/result/outline
      - name: Observe pinned Outline provider contracts (macOS and Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 3
        run: node tests/vscode-reference/outline-run.cjs target/vscode-reference/result/outline
      - name: Compare Outline provider geometry and confirmed reveals
        run: cargo run --locked --example outline_contract -- target/vscode-reference/result/outline/outline.json > target/vscode-reference/result/outline/outline-vscli.json
      - name: Check Outline reference source validation
        run: cargo test --locked --example outline_contract
      - name: Observe pinned Breadcrumbs provider contracts (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a node tests/vscode-reference/breadcrumbs-run.cjs target/vscode-reference/result/breadcrumbs
      - name: Observe pinned Breadcrumbs provider contracts (macOS and Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 3
        run: node tests/vscode-reference/breadcrumbs-run.cjs target/vscode-reference/result/breadcrumbs
      - name: Compare Breadcrumbs provider geometry and confirmed picker reveals
        run: cargo run --locked --example breadcrumbs_contract -- target/vscode-reference/result/breadcrumbs/breadcrumbs.json > target/vscode-reference/result/breadcrumbs/breadcrumbs-vscli.json
      - name: Check Breadcrumbs reference source validation
        run: cargo test --locked --example breadcrumbs_contract
      - name: Observe pinned save-formatting contracts (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: xvfb-run -a node tests/vscode-reference/save-formatting-run.cjs target/vscode-reference/result/save-formatting
      - name: Observe pinned save-formatting contracts (macOS and Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 3
        run: node tests/vscode-reference/save-formatting-run.cjs target/vscode-reference/result/save-formatting
      - name: Compare implemented native save-formatting contracts
        env:
          VSCLI_SAVE_FORMATTING_REFERENCE_DIR: target/vscode-reference/result/save-formatting
        run: cargo test --locked --test save_formatting_reference
      - name: Observe pinned code-actions-on-save contracts (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: xvfb-run -a node tests/vscode-reference/save-code-actions-run.cjs target/vscode-reference/result/save-code-actions
      - name: Observe pinned code-actions-on-save contracts (macOS and Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 4
        run: node tests/vscode-reference/save-code-actions-run.cjs target/vscode-reference/result/save-code-actions
      - name: Compare implemented native code-actions-on-save contracts
        env:
          VSCLI_SAVE_CODE_ACTIONS_REFERENCE_DIR: target/vscode-reference/result/save-code-actions
        run: cargo test --locked --test save_code_actions_reference
      - name: Run terminal workflows
        if: runner.os != 'Windows'
        timeout-minutes: 5
        run: python3 -u tests/pty_smoke.py target/debug/vscli
      - name: Run native code action queue workflow
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/code_actions_queue_pty.py target/debug/vscli
      - name: Run native smart typing workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/smart_typing_pty.py target/debug/vscli
      - name: Run advanced native indentation workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/advanced_indentation_pty.py target/debug/vscli
      - name: Run native installed language configuration workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/native_configuration_pty.py target/debug/vscli
      - name: Run native navigation history workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/navigation_history_pty.py target/debug/vscli
      - name: Run native Outline keyboard workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/outline_pty.py target/debug/vscli
      - name: Run native Breadcrumbs keyboard workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/breadcrumbs_pty.py target/debug/vscli
      - name: Run native settings persistence workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/settings_persistence_pty.py target/debug/vscli
      - name: Run native save automation workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/save_automation_pty.py target/debug/vscli
      - name: Run native format-on-save workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/native_format_on_save_pty.py target/debug/vscli
      - name: Observe committed editor-group tabs (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: xvfb-run -a node tests/vscode-reference/editor-group-tabs-run.cjs target/vscode-reference/result/editor-group-tabs
      - name: Observe committed editor-group tabs (macOS and Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 4
        run: node tests/vscode-reference/editor-group-tabs-run.cjs target/vscode-reference/result/editor-group-tabs
      - name: Compare native group membership with fresh pinned observations
        env:
          VSCLI_EDITOR_GROUP_TABS_REFERENCE_DIR: ${{ github.workspace }}/target/vscode-reference/result/editor-group-tabs
        run: cargo test --locked --test editor_group_tabs_reference
      - name: Check preview observer resource identity and listener evidence
        run: node --test tests/vscode-reference/editor-preview-tabs-paths.test.cjs
      - name: Observe preview and sticky tab lifecycle (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: xvfb-run -a node tests/vscode-reference/editor-preview-tabs-run.cjs target/vscode-reference/result/editor-preview-tabs
      - name: Observe preview and sticky tab lifecycle (macOS and Windows)
        if: runner.os != 'Linux'
        timeout-minutes: 4
        run: node tests/vscode-reference/editor-preview-tabs-run.cjs target/vscode-reference/result/editor-preview-tabs
      - name: Check preview reference integrity and replay tests
        run: cargo test --locked --example editor_preview_tabs_contract
      - name: Compare native preview lifecycle with fresh complete observations
        run: cargo run --locked --example editor_preview_tabs_contract -- target/vscode-reference/result/editor-preview-tabs > target/vscode-reference/result/editor-preview-tabs/native-comparison.json
      - name: Preserve reference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-reference-${{ matrix.os }}
          path: target/vscode-reference/result/
          retention-days: 30
      - name: Run independent editor-group tab workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/editor_group_tabs_pty.py target/debug/vscli
      - name: Run native preview tab ownership workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/editor_preview_tabs_pty.py target/debug/vscli
      - name: Run native code-actions-on-save workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/native_code_actions_on_save_pty.py target/debug/vscli
      - name: Run automatic parameter hint workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/signature_hints_pty.py target/debug/vscli
      - name: Run graphical welcome lifecycle workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/welcome_brand_pty.py target/debug/vscli
      - name: Run clean-session restart workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/session_restore_pty.py target/debug/vscli
      - name: Run shared extension session workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/extension_sessions_pty.py target/debug/vscli
      - name: Run native extension prompt workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/extension_prompts_pty.py target/debug/vscli
      - name: Run native extension document and state workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/extension_documents_pty.py target/debug/vscli
      - name: Run native extension language provider workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/extension_providers_pty.py target/debug/vscli
      - name: Run native extension surface workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/extension_surfaces_pty.py target/debug/vscli
      - name: Check syntax colors during terminal edits
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/syntax_stability_pty.py target/debug/vscli
      - name: Run automatic native language services
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/automatic_language_services_pty.py target/debug/vscli
      - name: Run resolved extension completion workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/completion_resolve_pty.py target/debug/vscli
      - name: Run automatic native suggestion workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/suggestions_pty.py target/debug/vscli
      - name: Run native extension registry workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/extension_registry_pty.py target/debug/vscli
      - name: Run remembered extension activation workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/extension_activation_pty.py target/debug/vscli
      - name: Run native keyboard inspector workflows
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/keyboard_inspector_pty.py target/debug/vscli
      - name: Preserve adjacent Escape and original F1 input
        if: runner.os != 'Windows'
        timeout-minutes: 2
        run: python3 -u tests/adjacent_escape_pty.py target/debug/vscli
      - name: Check benchmark screen oracle (no timing threshold)
        if: runner.os != 'Windows'
        run: python3 scripts/bench_editor.py --vscli target/debug/vscli --sizes 10240 --trials 1 --keys 5 --idle-seconds 0.1 --output target/benchmark-smoke.json
      - name: Check single-line benchmark screen oracle (no timing threshold)
        if: runner.os != 'Windows'
        run: python3 scripts/bench_editor.py --vscli target/debug/vscli --single-line --sizes 1048576 --trials 1 --keys 5 --idle-seconds 0.1 --output target/benchmark-single-line-smoke.json
      - name: Check recovery benchmark workload (no timing threshold)
        if: runner.os != 'Windows'
        run: python3 scripts/bench_editor.py --vscli target/debug/vscli --sizes 10240 --trials 1 --keys 30 --key-interval-ms 100 --idle-seconds 0.1 --recovery --output target/benchmark-recovery-smoke.json
  protocols:
    name: Real protocol servers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action
        with:
          toolchain: '1.99.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y clangd
      - run: python -m pip install debugpy==1.8.22
      - run: clangd --version
      - run: cargo test --test language_server -- --ignored
      - run: cargo test --locked --test automatic_language_services -- --ignored
      - run: cargo build --locked
      - run: python3 -u tests/automatic_language_services_pty.py target/debug/vscli --real-clangd
      - run: python3 -u tests/suggestions_pty.py target/debug/vscli --real-clangd
      - run: python3 -u tests/signature_hints_pty.py target/debug/vscli --real-clangd
      - name: Qualify Outline with actual clangd
        env:
          VSCLI_CLANGD: /usr/bin/clangd
        run: cargo test --locked --test outline actual_clangd_namespace_class_methods_reveal_exact_utf16_and_preserve_dirty_work -- --ignored --exact
      - name: Qualify Breadcrumbs with actual clangd
        env:
          VSCLI_CLANGD: /usr/bin/clangd
        run: cargo test --locked --test breadcrumbs actual_clangd_breadcrumbs_enclosing_trail_and_sibling_reveal_preserve_dirty_work -- --ignored --exact
      - run: cargo test --test debug_adapter -- --ignored
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tyriar/vscode-sort-lines
          ref: eaf02bb141f1853d571b1e97574c6857e80a727c # 1.12.0, MIT
          path: target/sort-lines-upstream
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: target/sort-lines-upstream
      - run: npm run compile
        working-directory: target/sort-lines-upstream
      - run: cargo test --test extension_host -- --ignored
        env:
          VSCLI_TEST_SORT_LINES: ${{ github.workspace }}/target/sort-lines-upstream
      - run: cargo test --locked --test extension_installation -- --ignored
        env:
          VSCLI_TEST_SORT_LINES: ${{ github.workspace }}/target/sort-lines-upstream
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tyriar/vscode-lorem-ipsum
          ref: 99a5f039f26b1b657ac18e79f81a834a4df64a3d # 1.3.1, MIT
          path: target/lorem-ipsum-upstream
          persist-credentials: false
      - run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
        working-directory: target/lorem-ipsum-upstream
      - run: cargo test --locked --test extension_prompts -- --ignored
        env:
          VSCLI_TEST_LOREM_IPSUM: ${{ github.workspace }}/target/lorem-ipsum-upstream
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChristianKohler/NpmIntellisense
          ref: bc5521b659b700c8a91cf04897007c611ed9532a # 1.4.5, MIT
          path: target/npm-intellisense-upstream
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: target/npm-intellisense-upstream
      - run: npm run compile
        working-directory: target/npm-intellisense-upstream
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sql-formatter-org/sql-formatter-vscode
          ref: a9988c9e667efca000d17995dae742c9efcdcec8 # 4.2.6, MIT
          path: target/sql-formatter-upstream
          persist-credentials: false
      - run: npm exec --yes --package=yarn@1.22.22 -- yarn install --frozen-lockfile --ignore-scripts --non-interactive
        working-directory: target/sql-formatter-upstream
      - run: npm run build
        working-directory: target/sql-formatter-upstream
      - name: Qualify unchanged language-provider packages against native buffers
        run: cargo test --locked --test extension_provider_corpus -- --ignored
        env:
          VSCLI_NPM_INTELLISENSE: ${{ github.workspace }}/target/npm-intellisense-upstream
          VSCLI_SQL_FORMATTER: ${{ github.workspace }}/target/sql-formatter-upstream
      - run: cargo build --locked
      - name: Qualify unchanged language-provider packages in the terminal
        timeout-minutes: 2
        run: python3 -u tests/extension_provider_corpus_pty.py target/debug/vscli
        env:
          VSCLI_NPM_INTELLISENSE: ${{ github.workspace }}/target/npm-intellisense-upstream
          VSCLI_SQL_FORMATTER: ${{ github.workspace }}/target/sql-formatter-upstream
      - name: Prepare pinned unchanged Write Good Linter
        run: python3 tests/prepare_write_good.py
      - name: Qualify unchanged linter diagnostics against native buffers
        run: cargo test --locked --test write_good -- --ignored
        env:
          VSCLI_WRITE_GOOD: ${{ github.workspace }}/target/write-good-upstream
      - name: Qualify unchanged linter diagnostics in the terminal
        timeout-minutes: 2
        run: python3 -u tests/write_good_pty.py target/debug/vscli
        env:
          VSCLI_WRITE_GOOD: ${{ github.workspace }}/target/write-good-upstream
      - name: Verify unchanged linter source and dependencies after qualification
        run: python3 tests/prepare_write_good.py --verify-only
      - name: Prepare pinned unchanged official code action sample
        run: python3 tests/prepare_code_actions_sample.py
      - name: Qualify official code action sample against native buffers
        run: cargo test --locked --test code_actions_sample -- --ignored
        env:
          VSCLI_CODE_ACTIONS_SAMPLE: ${{ github.workspace }}/target/code-actions-sample-upstream/code-actions-sample
      - name: Qualify official code action sample in the terminal
        timeout-minutes: 2
        run: python3 -u tests/code_actions_sample_pty.py target/debug/vscli
        env:
          VSCLI_CODE_ACTIONS_SAMPLE: ${{ github.workspace }}/target/code-actions-sample-upstream/code-actions-sample
      - name: Qualify actual clangd alongside extension code action providers
        run: cargo test --locked --test extension_code_actions -- --ignored
        env:
          VSCLI_CLANGD: clangd
      - name: Verify unchanged official sample after qualification
        run: python3 tests/prepare_code_actions_sample.py --verify-only

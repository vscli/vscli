version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      rust-minor-updates:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      runner-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

[package]
name = "vscli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A native terminal editor with VS Code keyboard workflows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vscli/vscli"
homepage = "https://github.com/vscli/vscli"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
json5 = "0.4"
tempfile = "3"
ignore = "0.4"
regex = "1"
url = "2"
portable-pty = "0.9"
vt100 = "0.16"
trash = "5"
directories = "6"
notify = "8.2"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-json = "0.24.8"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[profile.release]
lto = "thin"
strip = true

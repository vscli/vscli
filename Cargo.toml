[package]
name = "vscli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A native terminal editor with VS Code keyboard workflows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vscli/vscli"
homepage = "https://github.com/vscli/vscli"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
json5 = "1.3"
tempfile = "3"
ignore = "0.4"
globset = "0.4"
regex = "1"
url = "2"
portable-pty = "0.9"
vt100 = "0.16"
trash = "5"
directories = "6"
notify = "8.2"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-json = "0.24.8"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
sha2 = "0.10"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
semver = "1"
ratatui-image = { version = "11.1.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
# Read buffered input across the 1 KiB parser boundary; see vendor/README.md.
crossterm = { path = "vendor/crossterm" }
# Backport chunk-boundary correctness fixes while retaining Unicode 17 tables.
unicode-segmentation = { path = "vendor/unicode-segmentation" }
